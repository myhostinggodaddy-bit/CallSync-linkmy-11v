name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Copy APK and write version.json from the APK itself
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/CallSync.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          BADGE=$("$AAPT" dump badging out/CallSync.apk | head -1)
          CODE=$(echo "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NAME=$(echo "$BADGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          cat > out/version.json <<JSON
          {"versionCode": $CODE, "versionName": "$NAME", "url": "https://linkmy.in/backend/ui/apk/CallSync-apk/CallSync.apk", "notes": "CallSync $NAME"}
          JSON
          cat out/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: CallSync-apk
          path: |
            android/out/CallSync.apk
            android/out/version.json
          if-no-files-found: error
