plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// GitHub gives every build a growing number, so each new APK is always newer than the last one.
// versionCode = run number + 800 (always above 7.0.x builds). versionName is fixed to 8.0.1.
def runNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "0")

android {
    namespace 'com.example.callsync'
    compileSdk 34

    defaultConfig {
        applicationId "in.linkmy.callsync"
        minSdk 24
        targetSdk 34
        versionCode(runNumber + 800)
        versionName("8.0.1")
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // Same key for every build => a new APK installs over the old one (no uninstall needed).
    signingConfigs {
        shared {
            storeFile file("callsync.keystore")
            storePassword "callsync123"
            keyAlias "callsync"
            keyPassword "callsync123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
